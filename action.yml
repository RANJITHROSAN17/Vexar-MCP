name: "Vexar-MCP — Lint & Security Scan"
description: "Audit Model Context Protocol (MCP) servers and AI agent tool schemas for security sinks, schema defects, and token bloat."
author: "Ranjith Rosan"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "File or directory path to scan."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that causes a non-zero exit code (error, warning, info, never)."
    required: false
    default: "error"
  max-tokens:
    description: "Maximum allowed estimated tokens per tool definition before MCP002 triggers."
    required: false
    default: "250"
  ignore:
    description: "Comma-separated list of rule IDs to ignore (e.g. MCP004,MCP008)."
    required: false
    default: ""
  sarif-output:
    description: "Optional file path to write SARIF v2.1.0 report for GitHub Code Scanning."
    required: false
    default: ""

outputs:
  score:
    description: "Overall health score (0-100)."
    value: ${{ steps.run_scan.outputs.score }}
  grade:
    description: "Letter grade (A+ to F)."
    value: ${{ steps.run_scan.outputs.grade }}
  total-diagnostics:
    description: "Total number of diagnostics emitted."
    value: ${{ steps.run_scan.outputs.total_diagnostics }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Vexar-MCP
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run vexar-mcp scan
      id: run_scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        set -euo pipefail
        EXTRA_ARGS=()
        if [[ -n "${INPUT_IGNORE}" ]]; then
          EXTRA_ARGS+=(--ignore "${INPUT_IGNORE}")
        fi

        if [[ -n "${INPUT_SARIF_OUTPUT}" ]]; then
          vexar-mcp scan "${INPUT_PATH}" \
            --format sarif \
            --fail-on never \
            --max-tokens "${INPUT_MAX_TOKENS}" \
            "${EXTRA_ARGS[@]}" > "${INPUT_SARIF_OUTPUT}"
        fi

        JSON_REPORT="$(mktemp)"
        vexar-mcp scan "${INPUT_PATH}" \
          --format json \
          --fail-on never \
          --max-tokens "${INPUT_MAX_TOKENS}" \
          "${EXTRA_ARGS[@]}" > "${JSON_REPORT}"

        python - "${JSON_REPORT}" <<'PY' >> "${GITHUB_OUTPUT}"
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as fh:
            data = json.load(fh)
        print(f"score={data['summary']['score']}")
        print(f"grade={data['summary']['grade']}")
        print(f"total_diagnostics={data['summary']['total_diagnostics']}")
        PY

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          vexar-mcp scan "${INPUT_PATH}" \
            --format markdown \
            --fail-on never \
            --max-tokens "${INPUT_MAX_TOKENS}" \
            "${EXTRA_ARGS[@]}" >> "${GITHUB_STEP_SUMMARY}"
        fi

        vexar-mcp scan "${INPUT_PATH}" \
          --format terminal \
          --fail-on "${INPUT_FAIL_ON}" \
          --max-tokens "${INPUT_MAX_TOKENS}" \
          "${EXTRA_ARGS[@]}"
