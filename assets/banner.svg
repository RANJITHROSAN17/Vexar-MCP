    <rect x="426" y="0" width="176" height="38" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="514" y="24" text-anchor="middle" fill="#6ee7b7">SARIF + CI Action</text>

    <rect x="618" y="0" width="222" height="38" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <text x="729" y="24" text-anchor="middle" fill="#fbcfe8">Zero Runtime Deps</text>
