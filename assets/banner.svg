<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="Vexar-MCP banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Left shield + pulse icon -->
  <g transform="translate(72, 72)">
    <rect width="140" height="176" rx="28" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M70 30 L114 48 V88 C114 120 94 143 70 154 C46 143 26 120 26 88 V48 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <polyline points="40,92 58,92 66,70 76,112 84,86 100,86" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & subtitle -->
  <text x="252" y="128" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
    Vexar-MCP
  </text>
  <rect x="605" y="92" width="92" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="651" y="115" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
    v0.1.0
  </text>

  <text x="252" y="176" fill="#cbd5e1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500">
    Static Security Scanner, Schema Linter &amp; Token-Budget Auditor for MCP Servers
  </text>

  <!-- Feature pills -->
  <g transform="translate(252, 208)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">
    <rect x="0" y="0" width="188" height="38" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="94" y="24" text-anchor="middle" fill="#7dd3fc">AST Security Sinks</text>

    <rect x="204" y="0" width="206" height="38" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
