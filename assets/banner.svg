<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Vexar-MCP</title>
  <desc id="desc">Vexar-MCP — security and quality checks for MCP servers. Static analysis, schema linting and token-budget auditing.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1017"/>
      <stop offset="1" stop-color="#0F1A24"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#panel)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="17.25" fill="none" stroke="#1E2B38" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#edge)"/>

  <!-- Mark: a shield fused with a scan bracket -->
  <g transform="translate(72 74)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#0D1A22" stroke="#1F3A44" stroke-width="1.5"/>
    <path d="M56 22 L86 34 V62 C86 82 72 95 56 101 C40 95 26 82 26 62 V34 Z"
          fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M43 61 L52 70 L70 52" fill="none" stroke="#5EEAD4" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 46 H12 M20 66 H12 M20 86 H12" stroke="#2DD4BF" stroke-width="2.4"
          stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="216" y="126" fill="#F1F5F9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1.4">Vexar-MCP</text>

  <text x="216" y="166" fill="#94A3B8"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400">Security and quality checks for MCP servers</text>

  <!-- Capability labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="216" y="192" width="214" height="34" rx="8" fill="#0F1E26" stroke="#1F3A44" stroke-width="1.2"/>
    <text x="323" y="214" text-anchor="middle" fill="#5EEAD4">risky Python patterns</text>

    <rect x="442" y="192" width="180" height="34" rx="8" fill="#0F1E26" stroke="#1F3A44" stroke-width="1.2"/>
    <text x="532" y="214" text-anchor="middle" fill="#7DD3FC">tool schemas</text>

    <rect x="634" y="192" width="196" height="34" rx="8" fill="#0F1E26" stroke="#1F3A44" stroke-width="1.2"/>
    <text x="732" y="214" text-anchor="middle" fill="#A5B4FC">token budgets</text>
  </g>

  <!-- Right-hand sample annotation, echoing real CLI output -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="866" y="76" width="262" height="30" rx="6" fill="#141F2B" stroke="#243444" stroke-width="1"/>
    <text x="880" y="96" font-size="13" fill="#64748B">$</text>
    <text x="896" y="96" font-size="13" fill="#CBD5E1">vexar-mcp scan .</text>

    <rect x="866" y="114" width="262" height="30" rx="6" fill="#1B1417" stroke="#4A222A" stroke-width="1"/>
    <text x="880" y="134" font-size="12.5" fill="#FCA5A5">error  MCP005  shell-execution</text>

    <rect x="866" y="152" width="262" height="30" rx="6" fill="#1B1A12" stroke="#4A4022" stroke-width="1"/>
    <text x="880" y="172" font-size="12.5" fill="#FCD34D">warn   MCP006  unvalidated-ssrf</text>

    <rect x="866" y="190" width="262" height="30" rx="6" fill="#0F1B1F" stroke="#1F3A44" stroke-width="1"/>
    <text x="880" y="210" font-size="12.5" fill="#94A3B8">score  8/100  ·  2 tools</text>
  </g>
</svg>
