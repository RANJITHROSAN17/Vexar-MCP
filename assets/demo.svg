  <text x="530" y="27" fill="#64748b" text-anchor="middle">vexar-mcp — generated by scripts/make_demo_svg.py from real output</text>
      <text class="t0" x="26" y="74" fill="#34d399" font-weight="600" xml:space="preserve">$ vexar-mcp scan examples/ --policy strict-prod</text>
      <text class="t1" x="26" y="95" fill="#64748b" font-weight="400" xml:space="preserve">==============================================================================</text>
      <text class="t2" x="26" y="116" fill="#f8fafc" font-weight="600" xml:space="preserve">Vexar-MCP  |  Health Score: 4/100 (F)  |  Tools: 7 across 4 file(s)</text>
      <text class="t3" x="26" y="137" fill="#cbd5e1" font-weight="400" xml:space="preserve">Context Footprint: ~877 tokens  |  Errors: 4  Warnings: 5  Info: 3</text>
      <text class="t4" x="26" y="158" fill="#cbd5e1" font-weight="400" xml:space="preserve">Policy: strict-prod  |  Risk Index: 98/100 (critical)  |  Status: FINDINGS</text>
      <text class="t5" x="26" y="179" fill="#cbd5e1" font-weight="400" xml:space="preserve">Coverage: 4 candidate file(s), 4 analyzed, 0 failed, 4 with tools</text>
      <text class="t6" x="26" y="200" fill="#64748b" font-weight="400" xml:space="preserve">==============================================================================</text>
      <text class="t7" x="26" y="221" fill="#2dd4bf" font-weight="600" xml:space="preserve">FINDINGS - analyzed everything, issues reported</text>
      <text class="t9" x="26" y="263" fill="#f87171" font-weight="400" xml:space="preserve">[ERROR] MCP001 (missing-tool-description) at examples/vulnerable_server.py:23 [run] risk=45</text>
      <text class="t10" x="26" y="284" fill="#cbd5e1" font-weight="400" xml:space="preserve">Tool 'run' has an empty or overly brief description (0 chars; minimum 12 recommended).</text>
      <text class="t11" x="26" y="305" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Document purpose, inputs, and side effects in the tool docstring or `description`.</text>
      <text class="t12" x="26" y="326" fill="#f87171" font-weight="400" xml:space="preserve">[ERROR] MCP008 (ambiguous-or-duplicate-tool-name) at examples/vulnerable_server.py:23 [run] risk=45</text>
      <text class="t13" x="26" y="347" fill="#cbd5e1" font-weight="400" xml:space="preserve">Tool name 'run' is overly generic or violates `[a-z][a-z0-9_-]{2,63}`.</text>
      <text class="t14" x="26" y="368" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Use specific `verb_noun` `snake_case` naming such as `fetch_invoice_summary`.</text>
      <text class="t15" x="26" y="389" fill="#fbbf24" font-weight="400" xml:space="preserve">[WARN ] MCP003 (untyped-or-any-parameter) at examples/vulnerable_server.py:23 [run] risk=22</text>
      <text class="t16" x="26" y="410" fill="#cbd5e1" font-weight="400" xml:space="preserve">Parameter 'cmd' in tool 'run' has no type annotation.</text>
      <text class="t17" x="26" y="431" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Provide an explicit scalar, `Literal[...]`, `TypedDict`, or Pydantic `BaseModel` type.</text>
      <text class="t18" x="26" y="452" fill="#64748b" font-weight="400" xml:space="preserve">... 27 more lines from the same findings (run it to see all)</text>
      <text class="t20" x="26" y="494" fill="#64748b" font-weight="400" xml:space="preserve"># a file the scanner could not parse</text>
      <text class="t21" x="26" y="515" fill="#34d399" font-weight="600" xml:space="preserve">$ vexar-mcp scan broken_server.py</text>
      <text class="t22" x="26" y="536" fill="#f8fafc" font-weight="600" xml:space="preserve">Vexar-MCP  |  Health Score: n/a (nothing to grade)  |  Tools: 0 across 0 file(s)</text>
      <text class="t23" x="26" y="557" fill="#cbd5e1" font-weight="400" xml:space="preserve">Coverage: 1 candidate file(s), 0 analyzed, 1 failed, 0 with tools</text>
      <text class="t24" x="26" y="578" fill="#2dd4bf" font-weight="600" xml:space="preserve">ERROR - nothing could be analyzed</text>
      <text class="t25" x="26" y="599" fill="#2dd4bf" font-weight="600" xml:space="preserve">ANALYSIS ISSUES (these inputs were NOT checked)</text>
      <text class="t26" x="26" y="620" fill="#cbd5e1" font-weight="400" xml:space="preserve">[syntax_error] broken_server.py:1</text>
      <text class="t27" x="26" y="641" fill="#f87171" font-weight="400" xml:space="preserve">SyntaxError: invalid syntax</text>
      <text class="t28" x="26" y="662" fill="#fbbf24" font-weight="600" xml:space="preserve">No MCP tools or agent tool manifests discovered in target path(s). Nothing was graded — this is not a clean bill of</text>
      <text class="t29" x="26" y="683" fill="#fbbf24" font-weight="600" xml:space="preserve">    health.</text>
      <text class="t30" x="26" y="704" fill="#34d399" font-weight="600" xml:space="preserve">$ echo $?</text>
      <text class="t31" x="26" y="725" fill="#2dd4bf" font-weight="600" xml:space="preserve">3</text>
