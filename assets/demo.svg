  <text x="530" y="27" fill="#64748b" text-anchor="middle">vexar-mcp — generated by scripts/make_demo_svg.py from real output</text>
      <text class="t0" x="26" y="74" fill="#34d399" font-weight="600" xml:space="preserve">$ vexar-mcp scan examples/ --policy strict-prod</text>
      <text class="t1" x="26" y="95" fill="#64748b" font-weight="400" xml:space="preserve">==============================================================================</text>
      <text class="t2" x="26" y="116" fill="#f8fafc" font-weight="600" xml:space="preserve">Vexar-MCP  |  Health Score: 0/100 (F)  |  Tools: 11 across 5 file(s)</text>
      <text class="t3" x="26" y="137" fill="#cbd5e1" font-weight="400" xml:space="preserve">Context Footprint: ~1049 tokens  |  Errors: 5  Warnings: 7  Info: 3</text>
      <text class="t4" x="26" y="158" fill="#cbd5e1" font-weight="400" xml:space="preserve">Policy: strict-prod  |  Risk Index: 99/100 (critical)  |  Status: FINDINGS</text>
      <text class="t5" x="26" y="179" fill="#cbd5e1" font-weight="400" xml:space="preserve">Coverage: 5 candidate file(s), 5 analyzed, 0 failed, 5 with tools</text>
      <text class="t6" x="26" y="200" fill="#64748b" font-weight="400" xml:space="preserve">==============================================================================</text>
      <text class="t7" x="26" y="221" fill="#2dd4bf" font-weight="600" xml:space="preserve">FINDINGS - analyzed everything, issues reported</text>
      <text class="t9" x="26" y="263" fill="#f87171" font-weight="400" xml:space="preserve">[ERROR] MCP005 (dangerous-shell-execution) at examples/helper_delegation_server.py:41 [run_backup] risk=68</text>
      <text class="t10" x="26" y="284" fill="#cbd5e1" font-weight="400" xml:space="preserve">Tool 'run_backup' invokes dangerous execution sink `subprocess.run(shell=True)` with parameter 'command'.</text>
      <text class="t11" x="26" y="305" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Use `subprocess.run([cmd, arg], shell=False, check=True)` with validated arguments.</text>
      <text class="t12" x="26" y="326" fill="#fbbf24" font-weight="400" xml:space="preserve">[WARN ] MCP006 (unvalidated-ssrf-sink) at examples/helper_delegation_server.py:45 [download_report] risk=33</text>
      <text class="t13" x="26" y="347" fill="#cbd5e1" font-weight="400" xml:space="preserve">Tool 'download_report' passes parameter 'url' into outbound request `urllib.request.urlopen` without visible URL/host</text>
      <text class="t14" x="26" y="368" fill="#cbd5e1" font-weight="400" xml:space="preserve">    validation (potential SSRF).</text>
      <text class="t15" x="26" y="389" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Validate scheme/hostname with `urlparse` and reject RFC1918 / metadata IPs (`169.254.169.254`).</text>
      <text class="t16" x="26" y="410" fill="#fbbf24" font-weight="400" xml:space="preserve">[WARN ] MCP010 (missing-network-timeout) at examples/helper_delegation_server.py:45 [download_report] risk=22</text>
      <text class="t17" x="26" y="431" fill="#cbd5e1" font-weight="400" xml:space="preserve">Tool 'download_report' performs HTTP sink `urllib.request.urlopen` with parameter 'url' without an explicit</text>
      <text class="t18" x="26" y="452" fill="#cbd5e1" font-weight="400" xml:space="preserve">    `timeout=` argument.</text>
      <text class="t19" x="26" y="473" fill="#64748b" font-weight="400" xml:space="preserve">Fix: Pass `timeout=&lt;seconds&gt;` to the HTTP call (e.g., `requests.get(url, timeout=10)`).</text>
      <text class="t20" x="26" y="494" fill="#64748b" font-weight="400" xml:space="preserve">... 36 more lines from the same findings (run it to see all)</text>
      <text class="t22" x="26" y="536" fill="#64748b" font-weight="400" xml:space="preserve"># a file the scanner could not parse</text>
      <text class="t23" x="26" y="557" fill="#34d399" font-weight="600" xml:space="preserve">$ vexar-mcp scan broken_server.py</text>
      <text class="t24" x="26" y="578" fill="#f8fafc" font-weight="600" xml:space="preserve">Vexar-MCP  |  Health Score: n/a (nothing to grade)  |  Tools: 0 across 0 file(s)</text>
      <text class="t25" x="26" y="599" fill="#cbd5e1" font-weight="400" xml:space="preserve">Coverage: 1 candidate file(s), 0 analyzed, 1 failed, 0 with tools</text>
      <text class="t26" x="26" y="620" fill="#2dd4bf" font-weight="600" xml:space="preserve">ERROR - nothing could be analyzed</text>
      <text class="t27" x="26" y="641" fill="#2dd4bf" font-weight="600" xml:space="preserve">ANALYSIS ISSUES (these inputs were NOT checked)</text>
      <text class="t28" x="26" y="662" fill="#cbd5e1" font-weight="400" xml:space="preserve">[syntax_error] broken_server.py:1</text>
      <text class="t29" x="26" y="683" fill="#f87171" font-weight="400" xml:space="preserve">SyntaxError: invalid syntax</text>
      <text class="t30" x="26" y="704" fill="#fbbf24" font-weight="600" xml:space="preserve">No MCP tools or agent tool manifests discovered in target path(s). Nothing was graded — this is not a clean bill of</text>
      <text class="t31" x="26" y="725" fill="#fbbf24" font-weight="600" xml:space="preserve">    health.</text>
      <text class="t32" x="26" y="746" fill="#34d399" font-weight="600" xml:space="preserve">$ echo $?</text>
      <text class="t33" x="26" y="767" fill="#2dd4bf" font-weight="600" xml:space="preserve">3</text>
  <rect class="cursor" x="26" y="784" width="8" height="15" fill="#2dd4bf"/>
