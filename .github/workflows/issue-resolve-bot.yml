name: Issue Resolve Bot
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
jobs:
  resolve:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify linked issue fix
        run: |
          echo "Bot: closing linked issue on merge"
