name: CI

on:
  push:
    branches: ["main"]
  # Validate stacked prerequisite PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck with Mypy
        run: mypy src

      - name: Run Pytest with Coverage Gate
        run: pytest --cov=mcp_doctor --cov-report=term-missing --cov-fail-under=85

      - name: Validate Roadmap Bot Manifest
        run: python .github/scripts/sync_roadmap_issues.py --dry-run

  dogfood-github-action:
    name: Dogfood Composite Action
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run mcp-doctor composite action on clean example
        id: audit
        uses: ./
        with:
          path: examples/clean_server.py
          fail-on: warning
          sarif-output: mcp-doctor.sarif

      - name: Verify Action outputs and SARIF artifact
        run: |
          test "${{ steps.audit.outputs.score }}" = "100"
          test "${{ steps.audit.outputs.grade }}" = "A+"
          test -s mcp-doctor.sarif
