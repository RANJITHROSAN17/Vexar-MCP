name: CI

on:
  push:
    branches: ["main"]
  # Validate stacked prerequisite PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck with Mypy
        run: mypy src

      - name: Run Pytest with Coverage Gate
        run: pytest --cov=mcp_doctor --cov-report=term-missing --cov-fail-under=85

      - name: Validate Roadmap Bot Manifest
        run: python .github/scripts/sync_roadmap_issues.py --dry-run

      # An invalid workflow file shows up on GitHub as a failed run with no jobs, which
      # looks like a bot malfunction rather than a syntax error. Fail here instead.
      - name: Validate workflow and action manifests
        run: python .github/scripts/validate_workflows.py

  dogfood-github-action:
    name: Dogfood Composite Action
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Clean server must pass the action under strict-prod
        id: clean
        uses: ./
        with:
          path: examples/clean_server.py
          policy: strict-prod
          sarif-output: vexar-clean.sarif
          html-output: vexar-clean.html

      - name: Assert the clean run passed with an A+ score
        env:
          SCORE: ${{ steps.clean.outputs.score }}
          GRADE: ${{ steps.clean.outputs.grade }}
          RISK: ${{ steps.clean.outputs.risk-index }}
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "${EXIT_CODE}" = "0" || { echo "expected exit 0 on a clean server, got ${EXIT_CODE}"; exit 1; }
          test "${SCORE}" = "100" || { echo "expected score 100, got ${SCORE}"; exit 1; }
          test "${GRADE}" = "A+" || { echo "expected grade A+, got ${GRADE}"; exit 1; }
          test "${RISK}" = "0" || { echo "expected risk 0, got ${RISK}"; exit 1; }
          echo "clean run: score=${SCORE} grade=${GRADE} risk=${RISK}"

      # examples/ contains an intentionally insecure server, so a `ci` gate must fail.
      # This step is expected to fail: it proves the action propagates the gate result
      # instead of reporting success. The assertion below checks the output it produced.
      - name: Insecure example must be gated by the action
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: examples/
          policy: ci
          sarif-output: vexar.sarif
          html-output: vexar-report.html

      - name: Assert the action propagated the gate failure
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
          NEW_FINDINGS: ${{ steps.gate.outputs.new-findings }}
          POLICY: ${{ steps.gate.outputs.policy }}
        run: |
          set -euo pipefail
          test "${OUTCOME}" = "failure" || { echo "expected the gated run to fail, got ${OUTCOME}"; exit 1; }
          test "${EXIT_CODE}" = "1" || { echo "expected gate exit 1, got ${EXIT_CODE}"; exit 1; }
          test "${POLICY}" = "ci" || { echo "expected policy 'ci', got ${POLICY}"; exit 1; }
          test -s vexar.sarif
          test -s vexar-report.html
          grep -q "<!doctype html>" vexar-report.html
          grep -q '"version": "2.1.0"' vexar.sarif
          echo "gate propagated correctly: exit=${EXIT_CODE} policy=${POLICY} new=${NEW_FINDINGS}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexar-reports
          path: |
            vexar-clean.sarif
            vexar-clean.html
            vexar.sarif
            vexar-report.html

  dogfood-clean-server:
    name: Gate a clean server end-to-end
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Vexar-MCP
        run: python -m pip install -e "."

      - name: Strict production gate on the clean example
        run: |
          vexar-mcp scan examples/clean_server.py --policy strict-prod
          # A clean server must reach A+ under the strictest scoring.
          vexar-mcp scan examples/clean_server.py --policy strict-prod \
            --format json | python -c "import json,sys; d=json.load(sys.stdin)['summary']; assert d['score']==100, d; assert d['grade']=='A+', d"

      - name: Baseline adoption flow
        run: |
          set -euo pipefail
          vexar-mcp scan examples/ --write-baseline baseline.json
          # With the backlog accepted, the run must pass even under strict-prod.
          vexar-mcp scan examples/ --baseline baseline.json --policy strict-prod
          vexar-mcp baseline show baseline.json

      - name: Protected rules cannot be ignored
        run: |
          set +e
          vexar-mcp scan examples/ --policy strict-prod --ignore MCP005
          code=$?
          set -e
          test "${code}" = "2" || { echo "expected exit 2 for protected-rule ignore, got ${code}"; exit 1; }

      - name: Live audit a mock MCP server
        run: |
          set +e
          vexar-mcp audit-server --format json --fail-on never -- \
            python tests/fixtures/mock_mcp_server.py --paginate > live.json
          code=$?
          set -e
          test "${code}" = "0" || { echo "live audit errored with ${code}"; exit 1; }
          python - <<'PY'
          import json
          with open("live.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assert data["summary"]["tools_scanned"] == 3, data["summary"]
          assert "MCP001" in {d["rule_id"] for d in data["diagnostics"]}
          print("live audit OK:", data["summary"]["tools_scanned"], "tools")
          PY

      - name: Rule pack loads and is reported
        run: |
          set -euo pipefail
          cat > /tmp/acme-pack.toml <<'TOML'
          [[rule]]
          id = "ACME001"
          slug = "acme-namespace-required"
          severity = "warning"
          category = "contract"
          summary = "All tools must live in the acme_ namespace."
          remediation = "Rename the tool with an acme_ prefix."
          message = "Tool '{tool}' is outside the ACME namespace."
            [rule.match]
            name_regex = "^acme_"
            invert = true
          TOML
          vexar-mcp scan examples/clean_server.py --rule-pack /tmp/acme-pack.toml \
            --fail-on never --format json | python -c "import json,sys; ids={d['rule_id'] for d in json.load(sys.stdin)['diagnostics']}; assert 'ACME001' in ids, ids"

      - name: Configuration errors fail with exit code 2
        run: |
          set +e
          vexar-mcp scan examples/clean_server.py --policy does-not-exist
          code=$?
          set -e
          test "${code}" = "2" || { echo "expected exit 2 for unknown policy, got ${code}"; exit 1; }
