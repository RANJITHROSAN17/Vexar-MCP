name: PR Governance & Auto-Labeler Bot

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage-and-validate:
    name: Validate PR Title & Apply Size/Area Labels
    runs-on: ubuntu-latest
    steps:
      - name: Triage Pull Request
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;

            // 1. Conventional Commit PR title check
            const conventionalRe = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_.,/-]+\))?!?: .{5,}/;
            const titleOk = conventionalRe.test(pr.title);

            // 2. Compute PR size label + area labels from changed files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            let totalLines = 0;
            const areaLabels = new Set();

            for (const f of files) {
              totalLines += (f.additions || 0) + (f.deletions || 0);
              const p = f.filename;
              if (p.startsWith("src/mcp_doctor/rules/")) areaLabels.add("area/rules");
              if (p.startsWith("src/mcp_doctor/loaders/")) areaLabels.add("area/parsers");
              if (p.startsWith("src/mcp_doctor/reporters/")) areaLabels.add("area/reporters");
              if (p === "src/mcp_doctor/cli.py" || p === "src/mcp_doctor/config.py") areaLabels.add("area/cli");
              if (p.startsWith(".github/") || p === "action.yml") areaLabels.add("area/ci");
              if (p.endsWith(".md") || p.startsWith("examples/")) areaLabels.add("area/docs");
            }

            let sizeLabel = "size/XL";
            if (totalLines < 25) sizeLabel = "size/XS";
            else if (totalLines < 100) sizeLabel = "size/S";
            else if (totalLines < 300) sizeLabel = "size/M";
            else if (totalLines < 600) sizeLabel = "size/L";

            const existing = (pr.labels || []).map((l) => l.name);
            const cleaned = existing.filter((n) => !n.startsWith("size/"));
            const merged = Array.from(new Set([...cleaned, sizeLabel, ...areaLabels]));

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number,
              labels: merged,
            });

            if (!titleOk) {
              core.setFailed(
                `PR title "${pr.title}" must follow Conventional Commits, e.g. "feat(rules): add MCP009 secret scanner".`
              );
            }
