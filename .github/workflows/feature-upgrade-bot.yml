name: Feature Proposal Bot

# Proposes the next feature, once a week, in one issue that is edited rather than reopened.
#
# The previous version of this workflow triggered on every push to main *and* every pull
# request event, and its schedule was commented out with the note "disabled to stop duplicate
# daily bot issues". It also called `sync_roadmap_issues.py --count 1`, a flag the script did
# not accept, so argparse exited 2 and the fallback message fired every time. The bot had
# never once proposed anything. Both faults are fixed here: the trigger is scheduled, and the
# flag exists.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feature-proposal
  cancel-in-progress: false

jobs:
  propose:
    name: Propose the next roadmap item
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Choose the next item from the manifest
        id: pick
        run: |
          python .github/scripts/sync_roadmap_issues.py --dry-run --count 1 > proposed.txt
          cat proposed.txt

      - name: Publish or refresh the proposal
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- feature-proposal -->';
            const proposed = fs.readFileSync('proposed.txt', 'utf8').trim();
            const picked = proposed.split('\n').filter((line) => line.trim().startsWith('- [')).join('\n');

            if (!picked) {
              core.info('Every queued item already has an issue; no proposal needed.');
              return;
            }

            const body = [
              marker,
              '## Next feature, from the plan',
              '',
              'This is the head of the queue in `.github/roadmap.json`, re-derived weekly. ',
              'It is a proposal, not a decision: closing it says "not yet" without losing the item, ',
              'because the manifest still holds it.',
              '',
              '```',
              picked,
              '```',
              '',
              '**To act on it:** open the issue the curator already made for this item (search the ',
              'manifest id) and work the acceptance criteria there. Do not implement from this ',
              'proposal alone — the criteria are the definition of done, and this summary is not.',
              '',
              '**To change the plan instead:** edit `.github/roadmap.json`. That file is the queue.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100, labels: 'roadmap',
            });
            const existing = open.find((issue) => (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              core.info(`Updated proposal #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: 'Next feature proposal',
                body,
                labels: ['roadmap'],
              });
              core.info(`Created proposal #${created.data.number}`);
            }
