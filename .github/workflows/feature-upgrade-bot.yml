name: Feature Upgrade Bot — Daily Feature Proposal (Silent)
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  # Disabled to stop duplicate daily bot issues; use workflow_dispatch for manual runs.
  # schedule:
  #   - cron: "0 9 * * *"
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read queued roadmap tasks
        id: queued
        run: |
          python3 .github/scripts/sync_roadmap_issues.py --dry-run --count 1 > proposed.md 2>/dev/null || echo "No queued tasks — proposing upgrade to existing rules" > proposed.md
          echo "file=proposed.md" >> $GITHUB_OUTPUT
      - name: Propose new feature / upgrade
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const proposed = fs.existsSync('proposed.md') ? fs.readFileSync('proposed.md','utf8') : '';
            // Only propose if a real queued roadmap item exists (not fallback message)
            if (!proposed || proposed.includes('No queued tasks') || proposed.trim().length < 10) {
              console.log('No queued roadmap item — silent, no issue created.');
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `feat(upgrade): daily feature proposal — ${new Date().toISOString().slice(0,10)}`,
                body: `🤖 **Feature Upgrade Bot (silent)**\n\n• Status: queued / proposed\n• Source: .github/roadmap.json (15 queued)\n• Action required: maintainer selects next item from #1–#8 or proposes new\n• No notification sent to contributors until maintainer approves.\n\n---\n` + proposed,
                labels: ["help wanted","roadmap","difficulty/easy","area/upgrade"],
              });
            } catch (e) { console.log("No new feature issue needed today (silent).", e.message); }
