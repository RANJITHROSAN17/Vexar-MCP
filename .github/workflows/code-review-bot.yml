name: Code Review Bot — Required Review Gate (Silent Unless Blocked)
on:
  pull_request: {types: [opened, synchronize, reopened, edited]}
  pull_request_review: {types: [submitted]}

permissions:
  pull_requests: write
  contents: read
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Quality Gate Check (silence if pass)
        id: gate
        run: |
          /var/tmp/mcp-doctor-venv/bin/ruff check . || exit 1
          /var/tmp/mcp-doctor-venv/bin/mypy src || exit 1
          /var/tmp/mcp-doctor-venv/bin/pytest --cov=mcp_doctor --cov-fail-under=85 || exit 1
        # If this fails, bot comments; if passes, zero noise
      - name: Check conventional commit + labels + size
        id: format_check
        run: |
          title="${{ github.event.pull_request.title }}"
          echo "Title format check: $title"
          # Silent pass — no output if matches regex
          echo "$title" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: .+' || (echo "FAIL: title format"; exit 1)
      - name: Post review comment (silent pass / visible block)
        if: always() && (failure() || github.event_name == 'pull_request_review')
        uses: actions/github-script@v7
        with:
          script: |
            const pass = !(context.payload.pull_request || {}).merged; // simplified
            // Only post if gate failed OR review submitted and requires re-check
            if (process.env.GATE_STATUS !== 'success') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 **Code Review Bot (required)**\n• Quality gates: ruff / mypy / pytest (cov ≥85%)\n• PR format: Conventional Commits + labels + size tag\n• Status: ${pass ? 'PASS — silent' : 'BLOCKED — fix required before final-merge bot'}\n• Final merge requires: bot approval + @RANJITHROSAN17 approval (no auto-merge).`,
              });
            }
