name: Code Review Bot — Required Live Gate (Dynamic, Silent Pass, Block on Fail)
on:
  pull_request: {types: [opened, synchronize, reopened, edited, labeled, unlabeled]}
  pull_request_review: {types: [submitted, edited, dismissed]}
  pull_request_review_comment: {types: [created, edited, deleted]}
  issues: {types: [opened, edited, labeled, unlabeled]}
  push: {branches: [main]}

permissions:
  pull_requests: write
  contents: read
  issues: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Required Quality Gate (live — runs immediately)
        id: gate
        run: |
          echo "=== LIVE CODE REVIEW GATE ==="
          echo "Checking ruff..."
          ruff check . || { echo "FAIL: ruff errors"; exit 1; }
          echo "Checking mypy..."
          mypy src || { echo "FAIL: mypy errors"; exit 1; }
          echo "Checking pytest coverage (>=85)..."
          pytest --cov=mcp_doctor --cov-fail-under=85 || { echo "FAIL: coverage <85%"; exit 1; }
          echo "PASS: all gates cleared — silent (zero notification)"
      - name: Conventional Commit + Labels + Size Check
        id: format
        run: |
          title="${{ github.event.pull_request.title || github.event.issue.title || 'N/A' }}"
          echo "PR/Issue title: $title"
          echo "$title" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: .+' || { echo "FAIL: not Conventional Commit"; exit 1; }
          echo "PASS: format correct"
      - name: Post ONLY if blocked (silent if pass)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **CODE REVIEW BOT (LIVE — BLOCKED)**\n• gh trigger: ${context.eventName}\n• Gate: ruff / mypy / pytest (cov >=85%) / format / labels + size\n• Status: FAILED — fix required before final merge\n• Remind: only YOU approve final merge (ruleset blocks auto-merge)\n• Zero noise when passing.`
            });
