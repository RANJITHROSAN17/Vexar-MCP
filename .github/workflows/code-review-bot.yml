name: Code Review Bot — Required Live Gate + Result Report (Dynamic, Always Replies)
on:
  pull_request: {types: [opened, synchronize, reopened, edited, labeled, unlabeled]}
  pull_request_review: {types: [submitted, edited, dismissed]}
  pull_request_review_comment: {types: [created, edited, deleted]}
  issues: {types: [opened, edited, labeled, unlabeled]}
  push: {branches: [main]}

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install package + dev tools (fix: venv gone / runner bare)"
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[dev]"
          echo ".venv/bin" >> $GITHUB_PATH
          .venv/bin/ruff --version | head -1
          .venv/bin/mypy --version | head -1
          .venv/bin/pytest --version | head -1

      - name: "Run Full Review + Capture Results (fix: reference venv binaries)"
        id: result
        shell: bash
        # The PR/issue title is attacker-controlled text. It is passed through the
        # environment and only ever expanded as "$PR_TITLE": interpolating it into this
        # script (or into the github-script below) lets a title containing backticks or
        # $(...) run arbitrary commands with this job's token.
        env:
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title || 'N/A' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || 'N/A' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          VENV=".venv/bin"
          echo "=== CODE REVIEW BOT — LIVE GATE ===" > review_result.md
          echo "PR/Issue: $PR_NUMBER" >> review_result.md
          echo "Trigger: $EVENT_NAME" >> review_result.md
          echo "Title: $PR_TITLE" >> review_result.md

          echo "" >> review_result.md
          echo "--- QUALITY GATES ---" >> review_result.md

          echo "1/4 ruff check ." >> review_result.md
          $VENV/ruff check . >> review_result.md 2>&1
          RUFF_EXIT=$?
          echo "ruff exit: $RUFF_EXIT" >> review_result.md

          echo "" >> review_result.md
          echo "2/4 mypy src" >> review_result.md
          $VENV/mypy src >> review_result.md 2>&1
          MYPY_EXIT=$?
          echo "mypy exit: $MYPY_EXIT" >> review_result.md

          echo "" >> review_result.md
          echo "3/4 pytest --cov=mcp_doctor --cov-fail-under=85" >> review_result.md
          $VENV/pytest --cov=mcp_doctor --cov-fail-under=85 >> review_result.md 2>&1
          PYTEST_EXIT=$?
          echo "pytest exit: $PYTEST_EXIT" >> review_result.md

          echo "" >> review_result.md
          echo "4/4 Conventional Commit format + labels/size" >> review_result.md
          title="$PR_TITLE"
          if echo "$title" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: .+'; then
            echo "PASS: title matches Conventional Commits" >> review_result.md
            FORMAT_EXIT=0
          else
            echo "FAIL: title does NOT match Conventional Commits (need feat/fix/...)" >> review_result.md
            FORMAT_EXIT=1
          fi
          echo "format exit: $FORMAT_EXIT" >> review_result.md

          OVERALL=$(( RUFF_EXIT || MYPY_EXIT || PYTEST_EXIT || FORMAT_EXIT ))
          echo "" >> review_result.md
          if [ $OVERALL -eq 0 ]; then
            echo "=== FINAL RESULT: PASS (0 errors) ===" >> review_result.md
            echo "Coverage / quality: maintained at ≥85%" >> review_result.md
            echo "All 4 gates clear — merge ready (after your final approval)." >> review_result.md
          else
            echo "=== FINAL RESULT: BLOCKED (failures above) ===" >> review_result.md
            echo "Fix required before Final Merge Bot can ping you." >> review_result.md
          fi
          echo "overall_exit=$OVERALL" >> $GITHUB_OUTPUT
          echo "result_file=review_result.md" >> $GITHUB_OUTPUT
          echo "PASSED=$OVERALL" >> $GITHUB_OUTPUT
          echo "--- FULL LOG (truncated to 3500 chars for comment) ---" >> review_result.md
          # Append full log snippet already written above; comment step will truncate
          echo "log_lines=$(wc -l < review_result.md)" >> $GITHUB_OUTPUT
          echo "--- FILE CONTENTS ---"
          cat review_result.md

      - name: Post Review Comment — Always (result + score + improvement + log)
        if: always()
        uses: actions/github-script@v7
        env:
          # Same reason as above: the title reaches JavaScript through the environment,
          # never through string interpolation into the script body.
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title || 'N/A' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || 'N/A' }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const fs = require('fs');
            let result = "Result unavailable";
            try { result = fs.readFileSync('review_result.md','utf8'); } catch(e) { result = "Review result file not found — check workflow logs."; }

            const finalLine = result.split("\n").filter(l => l.includes("FINAL RESULT:")).pop() || "Result unclear";
            const isPass = finalLine.includes("PASS");
            const score = isPass ? "PASS (100%)" : "BLOCKED — fix required";
            const improvement = isPass
              ? "All 4 gates passed: ruff 0 errors + mypy 0 issues + pytest ≥85% + format OK. Coverage maintained / improved."
              : "Gate failures shown above. Fix required before Final Merge Bot can ping you.";

            // Truncate log for comment (GitHub comment limit ~65536 chars, but safe at 4000)
            const logSnippet = result.length > 3500 ? result.substring(0, 3500) + "\n... [truncated] ..." : result;

            const body = `🤖 **CODE REVIEW BOT — LIVE RESULT (always replies)**\n\n` +
              `**Final Score:** ${score}\n` +
              `**Trigger:** \`${process.env.EVENT_NAME}\` | PR/Issue #${process.env.PR_NUMBER}\n` +
              `**Title check:** \`${process.env.PR_TITLE}\`\n\n` +
              `---\n` +
              `**What it verified (4 gates — live, dynamic):**\n` +
              `• ruff check .\n` +
              `• mypy src\n` +
              `• pytest --cov=mcp_doctor --cov-fail-under=85\n` +
              `• Conventional Commits format + labels / size tag\n\n` +
              `**What it improved / maintained:**\n` +
              improvement + `\n\n` +
              `---\n` +
              `**Full result log (first 3500 chars):**\n\n` +
              `\`\`\`\n${logSnippet}\n\`\`\`\n\n` +
              (isPass
                ? `✅ **Ready for Final Merge Bot.** Only @RANJITHROSAN17 approves (ruleset prevents auto-merge).`
                : `❌ **Fix required.** Re-push after correcting above failures. Bot will reply again automatically.`);

            // A push to main has no issue or PR in context; posting would 404.
            if (!context.issue || !context.issue.number) {
              core.info(`No issue/PR in context (event: ${context.eventName}); review log kept as an artifact only.`);
              core.summary.addRaw(body).write();
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
