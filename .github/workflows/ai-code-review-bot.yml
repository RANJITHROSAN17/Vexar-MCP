name: AI Code Reviewer & Enhancer Bot
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install Vexar-MCP
        run: |
          python -m pip install --quiet -e ".[dev]"
      - name: AI review — audit repository MCP code
        id: audit
        run: python .github/scripts/ai_review_report.py .

      - name: Post AI review (always)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '🤖 **AI Code Reviewer + Enhancer (Vexar-MCP)** — best-standard audit + enhancement suggestions.';
            try {
              const report = fs.readFileSync('ai_review_report.md', 'utf8');
              body += '\n\n---\n\n' + report;
            } catch (e) {
              body += '\n\nAudit report not generated (no diagnostics or load error).';
            }
            if (process.env.OPENAI_API_KEY) {
              body += '\n\n---\n**AI Enhancer (Vexar-MCP)** — OpenAI augmentation enabled; structured enhancement suggestions generated from audit results (security/schema/token).';
            }
            // Comment on the PR when there is one. On a push there is no PR, and a commit
            // comment would need `contents: write`, which this workflow does not request
            // (least privilege) — so the report goes to the job summary instead.
            const pr = context.payload.pull_request;
            if (pr && pr.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number,
                body: body
              });
            } else {
              await core.summary.addRaw(body).write();
              core.info('No pull request in context; report written to the job summary.');
            }
