name: AI Code Reviewer & Enhancer Bot
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull_requests: write
  contents: read
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Vexar-MCP
        run: |
          python -m pip install --quiet -e ".[dev]"
      - name: AI review — audit PR code
        id: audit
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'src')
          from mcp_doctor.engine import scan_paths
          from pathlib import Path
          results = scan_paths([Path('.')])
          # Structured report for bot comment
          lines = [
            '🤖 **AI Code Reviewer + Enhancer (Vexar-MCP)**',
            '',
            f'**Score:** {results.summary.score}/100  |  **Grade:** {results.summary.grade}',
            f'**Errors:** {results.summary.errors}  |  **Warnings:** {results.summary.warnings}  |  **Info:** {results.summary.info}',
            '',
            '| Rule | Severity | Line | Source | Remediation |',
            '|---|---|---|---|---|',
          ]
          for d in results.diagnostics:
            src = d.source_file.split('/')[-1] if d.source_file else '—'
            lines.append(f\"| {d.rule_id} | {d.severity.name} | {d.line} | {src} | {d.remediation[:60]}... |\")
          lines.append('')
          lines.append('---')
          # Enhancer suggestions based on categories
          sec = [d for d in results.diagnostics if d.category.name == 'SECURITY']
          sch = [d for d in results.diagnostics if d.category.name == 'SCHEMA']
          lines.append('### Enhancements')
          if sec:
            lines.append('- **Security**: Address ' + str(len(sec)) + ' sink(s) — prioritize `MCP005`/`MCP010`/`MCP013`.')
          if sch:
            lines.append('- **Schema**: Add bounds (`max_length`, `le=`) to parameters.')
          lines.append('- **Token footprint**: Check `estimate_tool_tokens`; consider reducing parameter descriptions if >250 tokens.')
          lines.append('- **Next**: Run `vexar-mcp audit --format sarif` for CI integration.')
          Path('ai_review_report.md').write_text('\\n'.join(lines))
          print('Report written to ai_review_report.md')
          "
      - name: Post AI review (always)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '🤖 **AI Code Reviewer + Enhancer (Vexar-MCP)** — best-standard audit + enhancement suggestions.';
            try {
              const report = fs.readFileSync('ai_review_report.md', 'utf8');
              body += '\n\n---\n\n' + report;
            } catch (e) {
              body += '\n\nAudit report not generated (no diagnostics or load error).';
            }
            if (process.env.OPENAI_API_KEY) {
              body += '\n\n---\n**AI Enhancer (Vexar-MCP)** — OpenAI augmentation enabled; structured enhancement suggestions generated from audit results (security/schema/token).';
            }
            const isPR = context.payload.pull_request;
            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: isPR.number,
                body: body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha,
                body: body
              });
            }
