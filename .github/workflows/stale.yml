name: Stale Triage Bot

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Triage Inactive Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: "roadmap,good first issue,help wanted,pinned,type/security"
          exempt-pr-labels: "pinned,dependencies"
          stale-issue-message: "This issue has had no activity for 60 days. Comment if it is still relevant, otherwise it will close in 14 days."
          stale-pr-message: "This PR has had no activity for 30 days. Let us know if you would like help rebasing or finishing it!"
