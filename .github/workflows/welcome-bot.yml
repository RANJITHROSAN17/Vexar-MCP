name: Contributor Welcome Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet-contributor:
    name: Welcome External Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Post onboarding comment for first-time contributors
        uses: actions/github-script@v9
        with:
          script: |
            const isPR = Boolean(context.payload.pull_request);
            const target = isPR ? context.payload.pull_request : context.payload.issue;
            const author = target.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (author === owner || author.endsWith("[bot]") || target.user.type === "Bot") {
              core.info(`Skipping welcome comment for ${author}.`);
              return;
            }

            const body = isPR
              ? [
                  `👋 Welcome @${author}, and thank you for opening a Pull Request to **mcp-doctor**!`,
                  "",
                  "### Quick Maintainer Checklist",
                  "- Ensure your PR title follows **Conventional Commits** (e.g., `feat(rules): add MCP009 ...`).",
                  "- Link the issue being resolved in the PR description (`Closes #<number>`).",
                  "- Verify local checks pass (`ruff check .`, `mypy src`, and `pytest --cov=mcp_doctor`).",
                  "",
                  "Automated CI & governance checks are running now — a maintainer will review shortly!"
                ].join("\n")
              : [
                  `👋 Thanks for opening an issue in **mcp-doctor**, @${author}!`,
                  "",
                  "- Want to submit a PR for this or another open task? Check [`CONTRIBUTING.md`](../blob/main/CONTRIBUTING.md) and our [`good first issue`](../labels/good%20first%20issue) queue.",
                  "- Every rule, loader, and reporter is modular — most enhancements take <100 lines of Python plus unit tests!"
                ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: target.number,
              body,
            });
