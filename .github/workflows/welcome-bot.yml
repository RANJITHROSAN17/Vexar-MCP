name: Welcome Bot — First Contribution Greeting (Silent / Skip Bots)
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/welcome-bot.yml
      - .github/tests/welcome-bot.test.cjs
  # Metadata-only target events can comment on fork PRs without checking out
  # or executing contributor code. Never add a checkout to the welcome job.
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test .github/tests/welcome-bot.test.cjs

  welcome:
    if: github.event_name != 'pull_request'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            if (!item || item.user.type === 'Bot' || item.user.login === context.repo.owner) {
              core.info('Skipping maintainer/bot greeting.');
              return;
            }
            if (!['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR'].includes(item.author_association)) {
              core.info('Not a first contribution; no greeting needed.');
              return;
            }
            const marker = '<!-- mcp-doctor:first-contribution-welcome -->';
            const params = {...context.repo, issue_number: item.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            if (comments.some(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker))) {
              core.info('Already greeted; no duplicate comment.');
              return;
            }
            await github.rest.issues.createComment({
              ...params,
              body: `${marker}\n👋 **Welcome to mcp-doctor!**\nPlease read \`CONTRIBUTOR_RULES.md\`, add tests for your changes, and link the issue in your PR.`,
            });
