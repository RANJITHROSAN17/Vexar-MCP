name: Release Bot

# Tag push ─► build + test ─► GitHub Release ─► publish to PyPI (called, not triggered).
#
# The last step is an explicit `uses:` call rather than a `release: published` trigger because
# the Release created below is authored by GITHUB_TOKEN, and GitHub does not start workflows
# for events caused by GITHUB_TOKEN. Without the call, `git tag vX.Y.Z && git push --tags`
# produced a release and nothing else.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runs before the release exists: a tag that disagrees with pyproject.toml would
      # otherwise publish a GitHub Release advertising a version the code does not claim.
      - name: Verify the tag matches the packaged version
        run: python scripts/verify_release.py --tag "$GITHUB_REF_NAME"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build ".[dev]"
          pytest --cov=mcp_doctor --cov-fail-under=85
          python -m build

      - name: Create GitHub Release with generated changelog
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: Publish this release to PyPI
    needs: release
    # Called workflows inherit the caller's event but not its permissions, so the OIDC scope
    # that Trusted Publishing exchanges for an upload token has to be granted here.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      tag: ${{ github.ref_name }}
      dry-run: false
