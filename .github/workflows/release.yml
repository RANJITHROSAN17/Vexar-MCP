name: Release Bot

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build ".[dev]"
          pytest --cov=mcp_doctor --cov-fail-under=85
          python -m build

      - name: Create GitHub Release with generated changelog
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
