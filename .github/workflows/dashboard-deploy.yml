name: Deploy Dashboard (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - assets/dashboard.html
      - examples/**
      - src/**
      - pyproject.toml
      - .github/scripts/build_dashboard.py
      - .github/tests/dashboard.test.cjs
      - tests/test_dashboard.py
      - .github/workflows/dashboard-deploy.yml
  pull_request:
    paths:
      - assets/dashboard.html
      - examples/**
      - src/**
      - pyproject.toml
      - .github/scripts/build_dashboard.py
      - .github/tests/dashboard.test.cjs
      - tests/test_dashboard.py
      - .github/workflows/dashboard-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Vexar-MCP
        run: python -m pip install .
      - name: Prepare Pages site and example report
        run: python .github/scripts/build_dashboard.py --output build/pages
      - name: Test dashboard report rendering
        run: node --test .github/tests/dashboard.test.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
