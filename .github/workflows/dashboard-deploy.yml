name: Dashboard (GitHub Pages)

# Publishes the static report viewer.
#
# The published site is a directory artifact with three entries:
#   index.html          the viewer (Pages serves this for the site root)
#   dashboard.html      same file, kept so existing /dashboard.html links work
#   audit-report.json   a real scan of examples/, generated here at deploy time
#
# That last file is what turns the page from a labelled sample into real data:
# the viewer reads it over HTTP and reports where it came from. Nothing is
# committed; the report is rebuilt on every deploy.
on:
  push:
    branches: [main]
    paths:
      - "assets/dashboard.html"
      - "assets/banner.svg"
      - "examples/**"
      - "src/mcp_doctor/**"
      - ".github/workflows/dashboard-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Vexar-MCP
        # `[yaml]` for the same reason as the composite action: the deploy builds a demo
        # report from `examples/`, which contains a YAML manifest. Without the extra the
        # scan reports an unanalyzed input and exits 3, failing the deploy.
        run: python -m pip install --quiet "$GITHUB_WORKSPACE[yaml]"

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site

          # The viewer itself. Pages serves index.html for "/", and without it the
          # site root returns 404, so publish it under both names.
          cp assets/dashboard.html _site/index.html
          cp assets/dashboard.html _site/dashboard.html

          # Real report data for the demo. `--fail-on never` because the example
          # fixtures are intentionally vulnerable and this step must not fail the
          # deploy; the findings are the point.
          vexar-mcp scan examples/ --format json --fail-on never > _site/audit-report.json

      - name: Verify artifact
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/dashboard.html
          test -s _site/audit-report.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("_site/audit-report.json").read_text(encoding="utf-8"))
          summary = report["summary"]
          assert isinstance(summary["score"], int), "report is missing a numeric score"
          n = len(report.get("diagnostics", []))
          print(f"dashboard report: score={summary['score']} grade={summary['grade']} diagnostics={n}")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
