name: Issue Raise Bot
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronized]
jobs:
  raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise contributor issue
        run: |
          echo "Bot: open structured contributor issue from roadmap"
