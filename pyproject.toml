[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Vexar-MCP"
version = "0.1.0"
description = "Static analyzer, security scanner, schema validator, and token-budget auditor for Model Context Protocol (MCP) servers and AI agent tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Ranjith Rosan", email = "91519971+RANJITHROSAN17@users.noreply.github.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "llm",
  "linter",
  "security-scanner",
  "sarif",
  "static-analysis",
  "token-budget",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pyyaml>=6.0.1",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/RANJITHROSAN17/vexar-mcp"
Repository = "https://github.com/RANJITHROSAN17/vexar-mcp"
Issues = "https://github.com/RANJITHROSAN17/vexar-mcp/issues"
Changelog = "https://github.com/RANJITHROSAN17/vexar-mcp/releases"

[project.scripts]
vexar-mcp = "mcp_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_doctor = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
